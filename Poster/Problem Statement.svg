<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <rect width="1100" height="500" fill="#f7f9fd"/>
  <rect x="24" y="24" width="1052" height="452" rx="26" fill="#ffffff" stroke="#d5dff2" stroke-width="4"/>

  <rect x="48" y="62" width="310" height="230" rx="22" fill="#eef3fb" stroke="#cad7ef" stroke-width="3"/>
  <rect x="78" y="95" width="250" height="138" rx="18" fill="#173d7a"/>
  <polygon points="170,124 170,204 240,164" fill="#ffffff"/>
  <rect x="98" y="248" width="84" height="10" rx="5" fill="#ffcf5b"/>
  <rect x="192" y="248" width="66" height="10" rx="5" fill="#7fd1ff"/>
  <rect x="268" y="248" width="44" height="10" rx="5" fill="#8be0ae"/>

  <circle cx="392" cy="92" r="34" fill="#eef3fb" stroke="#cad7ef" stroke-width="3"/>
  <circle cx="392" cy="86" r="12" fill="#173d7a"/>
  <path d="M369 126c10-19 21-28 23-28s13 9 23 28" fill="#173d7a"/>

  <circle cx="472" cy="92" r="34" fill="#eef3fb" stroke="#cad7ef" stroke-width="3"/>
  <circle cx="472" cy="92" r="18" fill="none" stroke="#173d7a" stroke-width="7"/>
  <line x1="472" y1="92" x2="472" y2="80" stroke="#173d7a" stroke-width="7" stroke-linecap="round"/>
  <line x1="472" y1="92" x2="484" y2="100" stroke="#173d7a" stroke-width="7" stroke-linecap="round"/>

  <line x1="358" y1="176" x2="383" y2="110" stroke="#90a8d1" stroke-width="4" stroke-linecap="round"/>
  <line x1="358" y1="176" x2="448" y2="104" stroke="#90a8d1" stroke-width="4" stroke-linecap="round"/>

  <text x="520" y="105" fill="#163a70" font-family="Arial, sans-serif" font-size="30" font-weight="700">Problem Statement</text>
  <text x="408" y="152" fill="#54719f" font-family="Arial, sans-serif" font-size="22">Long lecture videos are difficult to search precisely.</text>
  <text x="408" y="186" fill="#54719f" font-family="Arial, sans-serif" font-size="22">Students remember fragments like a diagram, code snippet,</text>
  <text x="408" y="220" fill="#54719f" font-family="Arial, sans-serif" font-size="22">or spoken phrase, but not the exact timestamp.</text>

  <rect x="392" y="270" width="650" height="118" rx="20" fill="#173d7a"/>
  <circle cx="422" cy="312" r="7" fill="#ffcf5b"/>
  <text x="440" y="318" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">Transcript-only search misses visual and time-dependent explanations.</text>
  <circle cx="422" cy="355" r="7" fill="#7fd1ff"/>
  <text x="440" y="346" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">Revision becomes slow because learners must rewatch</text>
  <text x="440" y="372" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">large parts of the lecture video.</text>

  <rect x="48" y="320" width="320" height="120" rx="18" fill="#fff8e7" stroke="#f0d27d" stroke-width="3"/>
  <text x="72" y="355" fill="#8d6400" font-family="Arial, sans-serif" font-size="20" font-weight="700">Need</text>
  <text x="72" y="386" fill="#594200" font-family="Arial, sans-serif" font-size="19">Find the exact explanation in seconds,</text>
  <text x="72" y="413" fill="#594200" font-family="Arial, sans-serif" font-size="19">with evidence and timestamp, instead of</text>
  <text x="72" y="438" fill="#594200" font-family="Arial, sans-serif" font-size="19">searching through the whole lecture.</text>
</svg>
