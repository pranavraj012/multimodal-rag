<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <rect width="1000" height="1200" fill="#f7f9fd"/>
  <rect x="36" y="36" width="928" height="1128" rx="28" fill="#ffffff" stroke="#d5dff2" stroke-width="4"/>

