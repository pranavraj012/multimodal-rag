  <text x="170" y="126" fill="#173d7a" font-family="Arial, sans-serif" font-size="28">Where is yield point explained?</text>

  <rect x="72" y="195" width="856" height="420" rx="24" fill="#eef3fb" stroke="#cad7ef" stroke-width="3"/>
  <text x="105" y="240" fill="#163a70" font-family="Arial, sans-serif" font-size="30" font-weight="700">How the prototype works</text>

  <rect x="102" y="280" width="330" height="255" rx="24" fill="#173d7a"/>
  <rect x="127" y="312" width="280" height="168" rx="18" fill="#0f2a55"/>
  <polygon points="235,348 235,445 315,396" fill="#ffffff"/>
  <rect x="130" y="500" width="105" height="28" rx="14" fill="#ffcf5b"/>
  <text x="140" y="519" fill="#173d7a" font-family="Arial, sans-serif" font-size="15" font-weight="700">12:40-13:18</text>
  <rect x="247" y="500" width="105" height="28" rx="14" fill="#7fd1ff"/>
  <text x="257" y="519" fill="#173d7a" font-family="Arial, sans-serif" font-size="15" font-weight="700">14:02-14:35</text>
  <rect x="364" y="500" width="48" height="28" rx="14" fill="#8be0ae"/>
  <text x="373" y="519" fill="#173d7a" font-family="Arial, sans-serif" font-size="15" font-weight="700">clip</text>

  <rect x="468" y="280" width="420" height="255" rx="24" fill="#ffffff" stroke="#cad7ef" stroke-width="3"/>
  <text x="495" y="324" fill="#163a70" font-family="Arial, sans-serif" font-size="28" font-weight="700">System response</text>
  <text x="495" y="370" fill="#35588d" font-family="Arial, sans-serif" font-size="20">Yield point is discussed when the</text>
  <text x="495" y="401" fill="#35588d" font-family="Arial, sans-serif" font-size="20">stress-strain curve moves from elastic</text>
  <text x="495" y="432" fill="#35588d" font-family="Arial, sans-serif" font-size="20">to plastic behavior. The learner gets</text>
  <text x="495" y="463" fill="#35588d" font-family="Arial, sans-serif" font-size="20">grounded clips and can verify the</text>
  <text x="495" y="494" fill="#35588d" font-family="Arial, sans-serif" font-size="20">answer directly inside the lecture.</text>

  <rect x="495" y="510" width="138" height="30" rx="15" fill="#173d7a"/>
  <text x="505" y="530" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Grounded answer</text>
  <rect x="646" y="510" width="112" height="30" rx="15" fill="#173d7a"/>
  <text x="662" y="530" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Timestamps</text>
  <rect x="770" y="510" width="88" height="30" rx="15" fill="#173d7a"/>
  <text x="789" y="530" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Context</text>

  <rect x="72" y="655" width="856" height="220" rx="24" fill="#173d7a"/>
  <text x="108" y="710" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Prototype capabilities</text>
  <circle cx="118" cy="758" r="7" fill="#ffcf5b"/>
  <text x="138" y="765" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="22">Natural-language question answering</text>
  <circle cx="118" cy="804" r="7" fill="#7fd1ff"/>
  <text x="138" y="811" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="22">Timestamp-linked clip retrieval</text>
  <circle cx="118" cy="850" r="7" fill="#8be0ae"/>
  <text x="138" y="857" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="22">Follow-up queries and session continuity</text>

  <rect x="72" y="915" width="856" height="165" rx="24" fill="#fff8e7" stroke="#f0d27d" stroke-width="3"/>
  <text x="108" y="968" fill="#8d6400" font-family="Arial, sans-serif" font-size="28" font-weight="700">What the user experiences</text>
  <text x="108" y="1015" fill="#594200" font-family="Arial, sans-serif" font-size="22">Ask a lecture question, receive a grounded answer,</text>
  <text x="108" y="1048" fill="#594200" font-family="Arial, sans-serif" font-size="22">and jump directly to the relevant explanation</text>
  <text x="108" y="1081" fill="#594200" font-family="Arial, sans-serif" font-size="22">instead of manually searching the whole video.</text>
