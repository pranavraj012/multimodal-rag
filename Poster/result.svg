<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#f7f9fd"/>
  <rect x="40" y="40" width="1120" height="1120" rx="36" fill="#ffffff" stroke="#d5dff2" stroke-width="4"/>
  
  <text x="85" y="110" fill="#163a70" font-family="Arial, sans-serif" font-size="42" font-weight="700">Evaluation results</text>
  <text x="85" y="150" fill="#54719f" font-family="Arial, sans-serif" font-size="26">15 questions, 3 lecture videos, DeepEval with local judge</text>

  <!-- Top Boxes -->
  <rect x="85" y="210" width="310" height="200" rx="28" fill="#173d7a"/>
  <text x="125" y="290" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Dataset slice</text>
  <text x="125" y="335" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="26">3 domains</text>
  <text x="125" y="370" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="26">15 QA pairs</text>

  <rect x="420" y="210" width="310" height="200" rx="28" fill="#173d7a"/>
  <text x="460" y="290" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Metrics</text>
  <text x="460" y="335" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="26">AR, Faithfulness,</text>
  <text x="460" y="370" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="26">Context Precision</text>

  <rect x="755" y="210" width="360" height="200" rx="28" fill="#173d7a"/>
  <text x="795" y="290" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Main finding</text>
  <text x="795" y="335" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="24">Without rerank performed</text>
  <text x="795" y="370" fill="#d9e6ff" font-family="Arial, sans-serif" font-size="24">better on this slice</text>

  <!-- Chart Area -->
  <rect x="85" y="470" width="1030" height="420" rx="28" fill="#eef3fb" stroke="#cad7ef" stroke-width="3"/>
  <text x="125" y="525" fill="#163a70" font-family="Arial, sans-serif" font-size="32" font-weight="700">Aggregate comparison</text>

  <!-- Grid Lines -->
  <line x1="180" y1="820" x2="980" y2="820" stroke="#8ea7d0" stroke-width="4"/>
  <line x1="180" y1="750" x2="980" y2="750" stroke="#d3def2" stroke-width="2"/>
  <line x1="180" y1="680" x2="980" y2="680" stroke="#d3def2" stroke-width="2"/>
  <line x1="180" y1="610" x2="980" y2="610" stroke="#d3def2" stroke-width="2"/>
  <line x1="180" y1="540" x2="980" y2="540" stroke="#d3def2" stroke-width="2"/>

  <!-- Y-Axis Labels -->
  <text x="120" y="827" fill="#54719f" font-family="Arial, sans-serif" font-size="22">0.0</text>
  <text x="120" y="757" fill="#54719f" font-family="Arial, sans-serif" font-size="22">0.2</text>
  <text x="120" y="687" fill="#54719f" font-family="Arial, sans-serif" font-size="22">0.4</text>
  <text x="120" y="617" fill="#54719f" font-family="Arial, sans-serif" font-size="22">0.6</text>
  <text x="120" y="547" fill="#54719f" font-family="Arial, sans-serif" font-size="22">0.8</text>

  <!-- AR Bars -->
  <rect x="230" y="608" width="70" height="212" rx="12" fill="#173d7a"/>
  <rect x="315" y="603" width="70" height="217" rx="12" fill="#7fd1ff"/>
  <text x="290" y="865" fill="#163a70" font-family="Arial, sans-serif" font-size="26">AR</text>

  <!-- Faithfulness Bars -->
  <rect x="485" y="655" width="70" height="165" rx="12" fill="#173d7a"/>
  <rect x="570" y="603" width="70" height="217" rx="12" fill="#7fd1ff"/>
  <text x="475" y="865" fill="#163a70" font-family="Arial, sans-serif" font-size="26">Faithfulness</text>

  <!-- CP Bars -->
  <rect x="740" y="575" width="70" height="245" rx="12" fill="#173d7a"/>
  <rect x="825" y="514" width="70" height="306" rx="12" fill="#7fd1ff"/>
  <text x="735" y="865" fill="#163a70" font-family="Arial, sans-serif" font-size="26">Context Precision</text>

  <!-- Legend -->
  <rect x="905" y="490" width="180" height="36" rx="18" fill="#173d7a"/>
  <text x="945" y="514" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">with rerank</text>
  <rect x="905" y="540" width="190" height="36" rx="18" fill="#7fd1ff"/>
  <text x="933" y="564" fill="#173d7a" font-family="Arial, sans-serif" font-size="20" font-weight="700">without rerank</text>

  <!-- Takeaway Box -->
  <rect x="85" y="950" width="1030" height="140" rx="28" fill="#fff8e7" stroke="#f0d27d" stroke-width="4"/>
  <text x="130" y="1010" fill="#8d6400" font-family="Arial, sans-serif" font-size="30" font-weight="700">Takeaway:</text>
  <text x="290" y="1010" fill="#8d6400" font-family="Arial, sans-serif" font-size="30">the pipeline works, but reranking</text>
  <text x="130" y="1060" fill="#8d6400" font-family="Arial, sans-serif" font-size="30">still needs calibration for broader educational queries.</text>
</svg>
